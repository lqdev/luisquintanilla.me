name: Post Statistics
on:
  schedule: 
    - cron: '30 0 1 * *'
  workflow_dispatch: 
jobs:
  Run-Stats:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET SDK 11.x
        uses: actions/setup-dotnet@v6
        with: 
          global-json-file: global.json
          cache: false
      - name: Install dependencies
        run: dotnet restore
      - name: Build project
        run: dotnet build --no-restore          
      - name: Display Post Metrics
        run: |
          dotnet fsi Scripts/stats.fsx >> $GITHUB_STEP_SUMMARY
          echo "✅ Statistics summary generated successfully"