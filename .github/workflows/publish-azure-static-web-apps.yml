name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:      
  # pull_request:
  #   types: [opened, synchronize, reopened, closed]
  #   branches:
  #     - main

# Serialize deploys to the single Azure SWA production environment. A newer push
# to main cancels an older in-flight deploy so the latest commit always wins,
# preventing "Deployment Canceled" races when PRs merge in quick succession.
concurrency:
  group: azure-swa-deploy
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Main build and deployment job
  # Builds the F# static site generator, generates content, and deploys to Azure
  # Uploads artifacts for downstream notification jobs
  # ============================================================================
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    outputs:
      # Whether the build produced AT Protocol POSSE staging (AtProtoBuilder.useAtProtoSync /
      # useAtProtoNotesSync). When the relevant flag is off, the check reports 'false' and the
      # matching sync step is skipped. See docs/atproto/.
      atproto_staged: ${{ steps.atproto_check.outputs.staged }}          # Track A: site.standard.document (Posts)
      notes_staged: ${{ steps.atproto_check.outputs.notes_staged }}      # Track B: app.bsky.feed.post (Notes)
      media_staged: ${{ steps.atproto_check.outputs.media_staged }}      # Track C: images + galleries
      video_staged: ${{ steps.atproto_check.outputs.video_staged }}      # Track C: video
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      
      - name: Setup .NET SDK 10.x
        uses: actions/setup-dotnet@v4
        with: 
          dotnet-version: '10.0.x'
          cache: false
      
      - name: Install Dependencies
        run: dotnet restore --force-evaluate
      
      - name: Build project
        run: dotnet build --no-restore
      
      - name: Generate website
        run: dotnet run

      # AT Protocol POSSE (#2574 / ADR-0009). When AtProtoBuilder.useAtProtoSync / useAtProtoNotesSync
      # are off, no staging is produced and this reports staged/notes_staged=false → the matching sync
      # step is skipped and _public stays byte-identical to the pre-integration baseline. When a flag
      # is on, staging appears here and the corresponding sync runs. This step never fails the build.
      - name: Check for AT Protocol staging
        id: atproto_check
        run: |
          if ls _public/api/data/atproto/documents/*.json >/dev/null 2>&1; then
            COUNT=$(ls _public/api/data/atproto/documents/*.json | wc -l)
            echo "staged=true" >> "$GITHUB_OUTPUT"
            echo "🌐 AT Protocol document staging present ($COUNT record(s)) — Track A sync will run."
          else
            echo "staged=false" >> "$GITHUB_OUTPUT"
            echo "AT Protocol document staging absent (useAtProtoSync is off) — Track A sync skipped."
          fi
          if ls _public/api/data/atproto/posts/*.json >/dev/null 2>&1; then
            NCOUNT=$(ls _public/api/data/atproto/posts/*.json | wc -l)
            echo "notes_staged=true" >> "$GITHUB_OUTPUT"
            echo "🌐 AT Protocol note staging present ($NCOUNT record(s)) — Track B sync will run."
          else
            echo "notes_staged=false" >> "$GITHUB_OUTPUT"
            echo "AT Protocol note staging absent (useAtProtoNotesSync is off) — Track B sync skipped."
          fi
          IMAGE_COUNT=0
          for MEDIA_DIR in _public/api/data/atproto/media/images _public/api/data/atproto/media/galleries; do
            if [ -d "$MEDIA_DIR" ]; then
              IMAGE_COUNT=$((IMAGE_COUNT + $(find "$MEDIA_DIR" -maxdepth 1 -type f -name '*.json' | wc -l)))
            fi
          done
          VIDEO_COUNT=0
          if [ -d _public/api/data/atproto/media/videos ]; then
            VIDEO_COUNT=$(find _public/api/data/atproto/media/videos -maxdepth 1 -type f -name '*.json' | wc -l)
          fi
          if [ "$IMAGE_COUNT" -gt 0 ]; then
            echo "media_staged=true" >> "$GITHUB_OUTPUT"
            echo "🌐 AT Protocol image/gallery staging present ($IMAGE_COUNT record(s)) — Track C image sync can run."
          else
            echo "media_staged=false" >> "$GITHUB_OUTPUT"
            echo "AT Protocol image/gallery staging absent (media image/gallery flags are off) — Track C image sync skipped."
          fi
          if [ "$VIDEO_COUNT" -gt 0 ]; then
            echo "video_staged=true" >> "$GITHUB_OUTPUT"
            echo "🌐 AT Protocol video staging present ($VIDEO_COUNT record(s)) — Track C video sync can run."
          else
            echo "video_staged=false" >> "$GITHUB_OUTPUT"
            echo "AT Protocol video staging absent (media video flag is off) — Track C video sync skipped."
          fi

      - name: Identify webmentions to send
        run: dotnet fsi Scripts/identify-webmentions.fsx

      - name: Sync ActivityPub data for Azure Functions
        run: |
          echo "📦 Syncing generated ActivityPub data to Azure Functions directory..."
          echo "Syncing outbox data (paginated)..."
          mkdir -p api/data/outbox
          # Phase 5F: Copy all outbox files including pagination pages
          cp -v _public/api/data/outbox/*.json api/data/outbox/
          echo "Syncing followers data..."
          cp -v _public/api/data/followers.json api/data/followers.json
          echo "✅ ActivityPub data synced successfully"
          echo "Outbox files: $(ls api/data/outbox/ | wc -l) files"
          echo "Total outbox size: $(du -sh api/data/outbox/ | cut -f1)"
          echo "Followers size: $(du -h api/data/followers.json | cut -f1)"

      - name: Check website sizes
        run: |
          echo "🚀 TOTAL SITE SIZE: $(du -sh ./_public | cut -f1)"
          echo "================================================"
          chmod +x ./Scripts/check-site-sizes.sh
          ./Scripts/check-site-sizes.sh
      
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_WAVE_017E3760F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./_public" # App source code path
          api_location: "./api" # Api source code path for Azure Functions
          output_location: "." # Built app content directory - optional
          skip_app_build: true # Skip build since we already built with F#
          skip_api_build: false # Let Azure build the Node.js API
          ###### End of Repository/Build Configurations ######
      
      # Upload artifacts for downstream notification jobs
      # These jobs run independently and need access to build outputs
      - name: Upload webmention data for notification job
        uses: actions/upload-artifact@v4
        with:
          name: webmention-artifacts
          path: _tmp/webmentions.json
          retention-days: 1
      
      - name: Upload ActivityPub data for delivery queue
        uses: actions/upload-artifact@v4
        with:
          name: activitypub-artifacts
          # Phase 5F: Upload all outbox files including pagination pages
          path: _public/api/data/outbox/
          retention-days: 1

      - name: Upload Blog Archive exports
        uses: actions/upload-artifact@v4
        with:
          name: blog-archive-artifacts
          path: _public/archive/*.bar
          retention-days: 7

      # AT Protocol POSSE staging for the sync job. Only present when the relevant flag is on;
      # guarded on the check step so nothing is uploaded (and no warning) while the flag is off.
      - name: Upload AT Protocol staging for sync job
        if: steps.atproto_check.outputs.staged == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atproto-staging
          path: _public/api/data/atproto/documents/
          retention-days: 1

      - name: Upload AT Protocol note staging for sync job
        if: steps.atproto_check.outputs.notes_staged == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atproto-staging-notes
          path: _public/api/data/atproto/posts/
          retention-days: 1

      - name: Upload AT Protocol media staging for sync job
        if: steps.atproto_check.outputs.media_staged == 'true' || steps.atproto_check.outputs.video_staged == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atproto-staging-media
          path: _public/api/data/atproto/media/
          retention-days: 1

  # ============================================================================
  # Webmention Notification Job (Independent)
  # Sends webmentions to notify other sites of new response content
  # Depends on: build_and_deploy_job (for webmentions.json artifact)
  # Runs in parallel with: queue_activitypub_job
  # ============================================================================
  send_webmentions_job:
    needs: build_and_deploy_job
    runs-on: ubuntu-latest
    name: Send Webmentions
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      
      - name: Setup .NET SDK 10.x
        uses: actions/setup-dotnet@v4
        with: 
          dotnet-version: '10.0.x'
          cache: false
      
      - name: Download webmention data
        uses: actions/download-artifact@v4.1.8
        with:
          name: webmention-artifacts
          path: .
      
      # The F# script uses inline NuGet references (#r "nuget:...") 
      # and reads webmentions from the JSON file generated during build
      - name: Send Webmentions
        run: dotnet fsi Scripts/send-webmentions.fsx

  # ============================================================================
  # ActivityPub Delivery Queue Job (Independent)
  # Queues recent posts for federated delivery to ActivityPub followers
  # Depends only on: build_and_deploy_job
  # Runs in parallel with: send_webmentions_job
  # Only executes on main branch pushes (not PRs or manual triggers)
  # ============================================================================
  queue_activitypub_job:
    needs: build_and_deploy_job
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Queue ActivityPub Posts
    env:
      ACTIVITYPUB_STORAGE_CONNECTION: ${{ secrets.ACTIVITYPUB_STORAGE_CONNECTION }}
    steps:
      - name: Download ActivityPub artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          name: activitypub-artifacts
          path: _public/api/data/outbox/
      
      - name: Queue Recent Posts for Delivery
        run: |
          echo "📢 Queueing recent posts for delivery..."
          
          # Get the 2 most recent Create activities from outbox (skip Like/Announce which have string objects)
          RECENT_ITEMS=$(jq -r '[.orderedItems[] | select(.type == "Create")][:2] | .[] | @json' _public/api/data/outbox/page-1.json)
          
          if [ -z "$RECENT_ITEMS" ]; then
            echo "⚠️ No recent Create activities found in outbox"
            exit 0
          fi
          
          # Extract connection details
          ACCOUNT_NAME=$(echo "$ACTIVITYPUB_STORAGE_CONNECTION" | grep -oP 'AccountName=\K[^;]+')
          ACCOUNT_KEY=$(echo "$ACTIVITYPUB_STORAGE_CONNECTION" | grep -oP 'AccountKey=\K[^;]+')
          
          # Queue each item
          echo "$RECENT_ITEMS" | while IFS= read -r create_activity; do
            # Extract note ID from the create activity (object is always an object for Create activities)
            NOTE_ID=$(echo "$create_activity" | jq -r '.object.id // empty' | grep -oP '[^/]+$' || true)
            
            if [ -z "$NOTE_ID" ]; then
              echo "⚠️ Skipping activity without valid object.id"
              continue
            fi
            
            # Generate queue ID
            TIMESTAMP=$(date +%s%3N)
            RANDOM_HEX=$(openssl rand -hex 4)
            QUEUE_ID="post-${TIMESTAMP}-${RANDOM_HEX}"
            QUEUED_AT=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
            
            # Escape the create activity JSON for table storage
            CREATE_ESCAPED=$(echo "$create_activity" | jq -Rs .)
            
            # Build entity JSON
            ENTITY="{\"PartitionKey\":\"pending\",\"RowKey\":\"$QUEUE_ID\",\"noteId\":\"$NOTE_ID\",\"createActivity\":$CREATE_ESCAPED,\"status\":\"pending\",\"queuedAt\":\"$QUEUED_AT\",\"retryCount\":0}"
            
            # Insert into table using Azure REST API
            URL="https://${ACCOUNT_NAME}.table.core.windows.net/deliveryqueue"
            DATE=$(TZ=UTC date '+%a, %d %b %Y %H:%M:%S GMT')
            
            # Build canonicalized resource for SharedKeyLite
            CANONICALIZED_RESOURCE="/${ACCOUNT_NAME}/deliveryqueue"
            STRING_TO_SIGN="${DATE}\n${CANONICALIZED_RESOURCE}"
            SIGNATURE=$(printf "$STRING_TO_SIGN" | openssl dgst -sha256 -hmac "$(echo $ACCOUNT_KEY | base64 -d)" -binary | base64)
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL" \
              -H "x-ms-date: $DATE" \
              -H "x-ms-version: 2019-02-02" \
              -H "Authorization: SharedKeyLite $ACCOUNT_NAME:$SIGNATURE" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json;odata=nometadata" \
              -d "$ENTITY")
            
            if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "204" ]; then
              echo "✅ Queued: $NOTE_ID"
            else
              echo "⚠️ Failed to queue $NOTE_ID (HTTP $HTTP_CODE)"
            fi
          done
          
          echo "📦 Queued posts will be delivered by scheduled worker (every 5 minutes)"

  # ============================================================================
  # AT Protocol POSSE Sync Job (Independent)
  # Upserts site.standard.document records into the site's Bluesky-hosted PDS so
  # Posts become first-class ATmosphere / Standard.site documents (#2574 / ADR-0009).
  # Depends on: build_and_deploy_job (for the atproto-staging artifacts)
  # Gated on build_and_deploy_job outputs, so it is SKIPPED entirely
  # while AtProtoBuilder.useAtProtoSync is off (the committed default) — zero cost,
  # no confusing no-op runs. Only executes on main-branch pushes.
  # Runs in DRY-RUN mode (no --commit) until deliberately activated.
  # Activation runbook: docs/atproto/README.md
  # ============================================================================
  sync_atproto_job:
    needs: build_and_deploy_job
    if: (needs.build_and_deploy_job.outputs.atproto_staged == 'true' || needs.build_and_deploy_job.outputs.notes_staged == 'true' || needs.build_and_deploy_job.outputs.media_staged == 'true' || needs.build_and_deploy_job.outputs.video_staged == 'true') && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Sync AT Protocol Records
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup .NET SDK 10.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: false

      - name: Download AT Protocol document staging
        if: needs.build_and_deploy_job.outputs.atproto_staged == 'true'
        uses: actions/download-artifact@v4.1.8
        with:
          name: atproto-staging
          path: atproto-staging

      # ACTIVATED (Track A) — steady-state POSSE. Runs with `--commit` (no --limit), so each push to
      # main upserts every pending site.standard.document record into the PDS. Idempotent: records
      # whose sourceHash already matches are skipped. Create/update-only, collection-scoped to
      # site.standard.document (never touches app.bsky.* posts, never deletes). Requires the
      # ATPROTO_APP_PASSWORD repository secret + AtProtoBuilder.useAtProtoSync = true.
      # See docs/atproto/README.md for the runbook + safety model.
      - name: Sync AT Protocol documents (POSSE, Track A)
        if: needs.build_and_deploy_job.outputs.atproto_staged == 'true'
        env:
          ATPROTO_APP_PASSWORD: ${{ secrets.ATPROTO_APP_PASSWORD }}
        run: dotnet fsi Scripts/sync-atproto.fsx --dir atproto-staging --commit

      - name: Download AT Protocol note staging
        if: needs.build_and_deploy_job.outputs.notes_staged == 'true'
        uses: actions/download-artifact@v4.1.8
        with:
          name: atproto-staging-notes
          path: atproto-feed

      # ACTIVE (Track B, steady state) — Notes -> native app.bsky.feed.post. Runs only when note staging
      # is present (AtProtoBuilder.useAtProtoNotesSync = true → notes_staged=true). LIVE WRITE (`--commit`),
      # forward-only: eligibility is bounded by notesActivationCutoff (only Notes published on/after the
      # cutoff are staged), so each push upserts any pending post-cutoff Notes idempotently (create/update-
      # only, never deletes). The first activation used a `--limit 1` cautious cap; removed here now that
      # the pipeline is verified end-to-end. The sourceHash write-scope guard protects the hand-authored
      # posts in the shared app.bsky.feed.post collection (they carry no sourceHash → never in the plan).
      # See docs/atproto/README.md.
      - name: Sync AT Protocol notes (POSSE, Track B)
        if: needs.build_and_deploy_job.outputs.notes_staged == 'true'
        env:
          ATPROTO_APP_PASSWORD: ${{ secrets.ATPROTO_APP_PASSWORD }}
        run: dotnet fsi Scripts/sync-atproto.fsx --dir atproto-feed --collection app.bsky.feed.post --media-kind notes --commit

      - name: Download AT Protocol media staging
        if: needs.build_and_deploy_job.outputs.media_staged == 'true' || needs.build_and_deploy_job.outputs.video_staged == 'true'
        uses: actions/download-artifact@v4.1.8
        with:
          name: atproto-staging-media
          path: atproto-feed/media

      # DORMANT BY DEFAULT (Track C, image/gallery phase) — the static builder keeps these
      # manifests disabled until the image activation cutoff and flags are deliberately changed.
      # When enabled, this remains collection-scoped to app.bsky.feed.post and uses the same
      # sourceHash/create-update-only protections as Notes.
      - name: Sync AT Protocol images and galleries (POSSE, Track C)
        if: needs.build_and_deploy_job.outputs.media_staged == 'true'
        env:
          ATPROTO_APP_PASSWORD: ${{ secrets.ATPROTO_APP_PASSWORD }}
        run: dotnet fsi Scripts/sync-atproto.fsx --dir atproto-feed --collection app.bsky.feed.post --media-kind images --commit

      # DORMANT BY DEFAULT (Track C, video phase). Video uses the separate video.bsky.app
      # processing service and is independently gated from image/gallery activation.
      - name: Sync AT Protocol videos (POSSE, Track C)
        if: needs.build_and_deploy_job.outputs.video_staged == 'true'
        env:
          ATPROTO_APP_PASSWORD: ${{ secrets.ATPROTO_APP_PASSWORD }}
        run: dotnet fsi Scripts/sync-atproto.fsx --dir atproto-feed --collection app.bsky.feed.post --media-kind videos --commit

